name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 语料校验（zod）
        run: pnpm validate:content

      - name: 黑话检查
        run: pnpm check:jargon

      - name: 构建（含 zod 语料校验）
        run: pnpm build
